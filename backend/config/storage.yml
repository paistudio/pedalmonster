test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Supabase Storage's S3-compatible API — used in production, see docs/18-backend-build-plan.md.
# `public: true` skips URL signing since post/comment/chat/avatar photos need to be publicly
# viewable without expiring links; force_path_style is required for non-AWS S3-compatible hosts.
supabase:
  service: S3
  access_key_id: <%= ENV["SUPABASE_STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["SUPABASE_STORAGE_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("SUPABASE_STORAGE_REGION", "us-east-1") %>
  bucket: <%= ENV["SUPABASE_STORAGE_BUCKET"] %>
  endpoint: <%= ENV["SUPABASE_STORAGE_ENDPOINT"] %>
  force_path_style: true
  public: true

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
